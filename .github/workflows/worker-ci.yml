name: Worker verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Package production configuration without uploading
        run: |
          npx --no-install wrangler deploy -c wrangler.live-activities.toml --dry-run --outdir "$RUNNER_TEMP/cellblock-worker"
          sha256sum "$RUNNER_TEMP/cellblock-worker/index.js"
          printf 'Source commit: %s\n' "$GITHUB_SHA"
